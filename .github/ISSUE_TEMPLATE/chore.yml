name: Chore
description: Cleanup, refactoring, tooling or docs with no visible change for players
labels: ["chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now?
  - type: textarea
    id: done
    attributes:
      label: How do we know it is done?
