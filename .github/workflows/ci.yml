name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check files and references
        run: python3 .github/ci/checks.py repo

  godot-checks:
    name: Godot checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore Godot from cache
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot and verify its checksum
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          rm "$zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
      - name: Import, load and boot the project
        run: GODOT="$HOME/godot/godot" bash .github/ci/run_godot_checks.sh
      - name: Keep the Godot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs
          path: ${{ runner.temp }}/godot-logs
          retention-days: 7
          if-no-files-found: ignore
